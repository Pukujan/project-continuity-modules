name: PCM decision preflight live smoke

on:
  pull_request:
    paths:
      - 'src/continuity/decision_preflight.py'
      - 'tests/live_decision_preflight_smoke.py'
      - '.github/workflows/decision-preflight-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real GitHub issue revision smoke (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python tests/live_decision_preflight_smoke.py
